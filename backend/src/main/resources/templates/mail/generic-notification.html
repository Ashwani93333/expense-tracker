<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:'Segoe UI',Arial,sans-serif;color:#1f2937;">
<div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:linear-gradient(135deg,#2563eb,#1e40af);color:#ffffff;border-radius:12px 12px 0 0;padding:28px 32px;">
        <div style="font-size:24px;font-weight:700;" th:text="${appName}">Expense Tracker</div>
        <div style="font-size:14px;opacity:0.85;margin-top:4px;" th:text="${subject}">Notification</div>
    </div>
    <div style="background-color:#ffffff;border-radius:0 0 12px 12px;padding:32px;">
        <h1 style="font-size:20px;margin:0 0 8px;" th:text="${subject}">Notification</h1>
        <p style="font-size:14px;color:#6b7280;margin:0 0 20px;">
            Hello <strong th:text="${recipientName}">User</strong>,
        </p>
        <p style="font-size:14px;color:#374151;margin:0 0 24px;line-height:1.6;" th:text="${message}">
            Notification message goes here.
        </p>
        <div style="text-align:center;margin-bottom:24px;">
            <a href="/" style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:14px 32px;border-radius:8px;font-size:15px;font-weight:600;">View in Dashboard</a>
        </div>
    </div>
    <div style="text-align:center;padding:20px;font-size:12px;color:#9ca3af;">
        <p style="margin:0;">You received this notification from <span th:text="${appName}">Expense Tracker</span>.</p>
        <p style="margin:4px 0 0;">If you no longer wish to receive these emails, you can update your notification settings in the app.</p>
    </div>
</div>
</body>
</html>
