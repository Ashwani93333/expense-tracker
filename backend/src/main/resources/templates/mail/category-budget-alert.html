<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Category Budget Alert — ' + ${categoryName}">Category Budget Alert</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:'Segoe UI',Arial,sans-serif;color:#1f2937;">
<div style="max-width:600px;margin:0 auto;padding:24px;">
    <div style="background:linear-gradient(135deg,#2563eb,#1e40af);color:#ffffff;border-radius:12px 12px 0 0;padding:28px 32px;">
        <div style="font-size:24px;font-weight:700;" th:text="${appName}">Expense Tracker</div>
        <div style="font-size:14px;opacity:0.85;margin-top:4px;">Category budget alert</div>
    </div>
    <div style="background-color:#ffffff;border-radius:0 0 12px 12px;padding:32px;">
        <h1 style="font-size:20px;margin:0 0 8px;" th:text="'Category: ' + ${categoryName}">Category: Food &amp; Dining</h1>
        <p style="font-size:14px;color:#6b7280;margin:0 0 24px;">
            You have used <strong th:text="${percentUsed}">80.0%</strong> of your <span th:text="${monthLabel}">August 2026</span> budget for this category.
        </p>

        <div style="background-color:#f9fafb;border-radius:8px;padding:20px;margin-bottom:24px;">
            <div style="height:10px;background-color:#e5e7eb;border-radius:5px;overflow:hidden;margin-bottom:16px;">
                <div style="height:100%;border-radius:5px;background-color:#2563eb;width:100%"
                     th:style="'width:' + ${percentUsed} + ';background-color:' + (${exceeded} ? '#dc2626' : '#2563eb')"></div>
            </div>
            <table width="100%" cellspacing="0" cellpadding="0">
                <tr>
                    <td align="center" style="font-size:13px;color:#6b7280;">Spent<br><strong style="font-size:18px;color:#111827;" th:text="${spent}">₹4,000</strong></td>
                    <td align="center" style="font-size:13px;color:#6b7280;">Limit<br><strong style="font-size:18px;color:#111827;" th:text="${limit}">₹5,000</strong></td>
                    <td align="center" style="font-size:13px;color:#6b7280;">Remaining<br><strong style="font-size:18px;color:#111827;" th:text="${remaining}">₹1,000</strong></td>
                </tr>
            </table>
        </div>

        <a th:href="${ctaUrl}" style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;">View expenses</a>
    </div>
    <div style="text-align:center;padding:20px;font-size:12px;color:#9ca3af;">
        <p style="margin:0;">You are receiving this because budget alerts are enabled in your notification settings.</p>
        <p style="margin:4px 0 0;">&copy; <span th:text="${appName}">Expense Tracker</span></p>
    </div>
</div>
</body>
</html>
