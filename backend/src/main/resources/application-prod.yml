# ------------------------------------------------------------------
# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# No secrets live in this file — every value is read from the
# environment (see .env.example). Placeholders WITHOUT a default are
# intentionally required, so a misconfigured deploy fails fast instead
# of silently falling back to dev/localhost values.
# ------------------------------------------------------------------

server:
  port: ${PORT:8080}
  # Drain in-flight requests before exiting.
  shutdown: graceful
  # Honour X-Forwarded-* from the platform load balancer / reverse proxy.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # --- Database (Neon / PostgreSQL) ---
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: expense-tracker-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

  jpa:
    hibernate:
      # schema.sql (CREATE TABLE IF NOT EXISTS) bootstraps a fresh database;
      # `update` evolves an existing one. Set JPA_DDL_AUTO=validate once the
      # schema is stable and owned by migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      # Receipt-image / OCR uploads.
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  # --- Email (group invites, budget alerts, monthly summaries) ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: ${MAIL_PROTOCOL:smtp}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

# --- JWT auth (required: startup fails if unset) ---
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# --- Gemini AI (receipt OCR + category suggestion) ---
gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

app:
  cors:
    # Comma-separated list of allowed frontend origins (no trailing slash).
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  frontend:
    # Base URL used to build invite links and email CTA buttons.
    base-url: ${APP_FRONTEND_BASE_URL}
  storage:
    # Receipt upload directory. Mount a persistent volume here in production.
    location: ${APP_STORAGE_LOCATION:/app/uploads}
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    from-name: ${MAIL_FROM_NAME:Expense Tracker}
  scheduler:
    monthly-summary-cron: ${MONTHLY_SUMMARY_CRON:0 0 2 1 * *}
  classification:
    auto-assign-threshold: ${CLASSIFICATION_AUTO_ASSIGN_THRESHOLD:0.75}
    warn-threshold: ${CLASSIFICATION_WARN_THRESHOLD:0.50}
    fallback-category: ${CLASSIFICATION_FALLBACK_CATEGORY:Uncategorized}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    ttl-seconds: ${APP_CACHE_TTL_SECONDS:30}
    max-entries: ${APP_CACHE_MAX_ENTRIES:1000}

logging:
  level:
    root: INFO
    com.expensetracker: INFO
    org.hibernate.SQL: WARN
